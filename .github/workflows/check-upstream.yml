name: Check upstream
on:
  schedule:
    - cron: '0 1 * * *' # 09:00 Asia/Kuala_Lumpur
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: upstream-check
  cancel-in-progress: false
jobs:
  check:
    if: vars.UPSTREAM_SYNC_ENABLED == 'enabled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-upstream.mjs --issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
