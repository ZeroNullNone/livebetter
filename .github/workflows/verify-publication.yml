name: Verify publication
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: publication-check
  cancel-in-progress: false
jobs:
  verify:
    if: vars.PUBLICATION_CHECK_ENABLED == 'enabled' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node scripts/build-site.mjs
      - run: node scripts/sync-automation.mjs verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
