name: Merge reviewed sync
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sync-delivery
  cancel-in-progress: false
jobs:
  merge:
    if: vars.AUTO_MERGE_SYNC == 'enabled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
      pull-requests: read
      issues: read
      checks: read
      statuses: read
    steps:
      # Always run trusted default-branch code, including manual dispatches.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/sync-automation.mjs merge
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTO_MERGE_SYNC: ${{ vars.AUTO_MERGE_SYNC }}
          SYNC_AUTHORS: ${{ vars.SYNC_AUTHORS }}
          SYNC_REVIEWERS: ${{ vars.SYNC_REVIEWERS }}
